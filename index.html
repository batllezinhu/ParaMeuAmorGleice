<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa:#ff5e9c;
    --rosa-claro:#ffd6e8;
    --lilas:#a86bff;
    --laranja:#ff9e4f;
    --amarelo:#ffd93d;
    --fundo-1:#fff0f6;
    --fundo-2:#f3e8ff;
    --texto:#4a2b5e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--texto);
    background:linear-gradient(135deg,var(--fundo-1) 0%,var(--fundo-2) 50%,var(--rosa-claro) 100%);
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Pacifico',cursive;font-weight:400}
 
  /* ====== CABEÇALHO / HERO ====== */
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;position:relative;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,94,156,.18) 0,transparent 40%),
      radial-gradient(circle at 85% 30%,rgba(168,107,255,.20) 0,transparent 45%),
      radial-gradient(circle at 50% 85%,rgba(255,158,79,.18) 0,transparent 40%);
  }
  .hero .coracao-grande{
    font-size:70px;
    animation:apertar 1.4s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes apertar{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .hero h1{
    font-size:clamp(44px,8vw,84px);
    margin:14px 0 6px;
    background:linear-gradient(90deg,var(--rosa),var(--lilas),var(--laranja));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{font-size:clamp(18px,3vw,26px);font-weight:300;max-width:640px}
  .botao-entrar{
    margin-top:36px;
    padding:16px 42px;font-size:20px;font-weight:600;
    border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,var(--rosa),var(--lilas));
    color:#fff;box-shadow:0 8px 24px rgba(255,94,156,.45);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .botao-entrar:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 30px rgba(168,107,255,.5)}
 
  /* ====== SEÇÕES ====== */
  section{padding:80px 20px;max-width:1100px;margin:0 auto;text-align:center}
  section>h2{
    font-size:clamp(30px,5vw,46px);margin-bottom:14px;
    color:var(--rosa);
  }
  section>p.intro{margin-bottom:40px;font-weight:300;font-size:18px}
 
  /* ====== CONTADOR ====== */
  .contador{
    display:flex;flex-wrap:wrap;gap:16px;justify-content:center;
  }
  .contador .caixa{
    background:#fff;border-radius:24px;padding:24px 18px;min-width:110px;
    box-shadow:0 10px 25px rgba(168,107,255,.18);
    border:3px solid transparent;
    transition:transform .2s ease;
  }
  .contador .caixa:nth-child(1){border-color:var(--rosa)}
  .contador .caixa:nth-child(2){border-color:var(--lilas)}
  .contador .caixa:nth-child(3){border-color:var(--laranja)}
  .contador .caixa:nth-child(4){border-color:var(--amarelo)}
  body.travado #secaoContador{display:none}
  .contador .caixa:hover{transform:translateY(-6px) rotate(-2deg)}
  .contador .numero{
    font-size:40px;font-weight:700;
    color:var(--lilas);
  }
  .contador .rotulo{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
 
  /* ====== GALERIA (mosaico: mostra a foto inteira, sem recortes) ====== */
  .galeria{
    columns:3;column-gap:18px;
  }
  .foto-card{
    border-radius:24px;overflow:hidden;position:relative;
    box-shadow:0 12px 28px rgba(74,43,94,.18);
    margin-bottom:18px;
    break-inside:avoid;page-break-inside:avoid;
    transition:transform .25s ease;
    background:linear-gradient(135deg,var(--rosa-claro),var(--fundo-2));
  }
  .foto-card:hover{transform:scale(1.03) rotate(1.5deg)}
  .foto-card img{
    width:100%;height:auto;display:block;
    image-orientation:from-image;
  }
  .foto-card .legenda{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(74,43,94,.85));
    color:#fff;padding:40px 16px 14px;
    font-weight:600;
  }
  .foto-placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--lilas);font-size:16px;font-weight:600;gap:10px;padding:20px;
  }
  .foto-placeholder .emoji{font-size:52px}
 
  /* ====== CARTAS ====== */
  .cartas{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;perspective:1200px;
  }
  .carta{
    height:280px;cursor:pointer;position:relative;
    transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1);
  }
  .carta.virada{transform:rotateY(180deg)}
  .carta .face{
    position:absolute;inset:0;border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    backface-visibility:hidden;padding:24px;text-align:center;
    box-shadow:0 12px 28px rgba(74,43,94,.18);
  }
  .carta .frente{
    background:linear-gradient(135deg,var(--rosa),var(--lilas));color:#fff;
    font-size:22px;font-weight:700;gap:14px;
  }
  .carta .frente .emoji{font-size:56px}
  .carta .frente span.dica{font-size:13px;font-weight:400;opacity:.85}
  .carta .verso{
    background:#fff;transform:rotateY(180deg);
    font-weight:400;font-size:16px;line-height:1.6;white-space:pre-line;
  }
 
  /* ====== CARTA FINAL ====== */
  .carta-final .papel{
    background:#fff;border-radius:28px;padding:50px 40px;max-width:760px;margin:0 auto;
    box-shadow:0 15px 40px rgba(255,94,156,.25);
    position:relative;line-height:1.9;font-weight:300;font-size:18px;text-align:left;
  }
  .carta-final .papel::before{
    content:"💌";position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    font-size:44px;
  }
  .carta-final .papel .assinatura{
    font-family:'Pacifico',cursive;font-size:30px;color:var(--rosa);
    text-align:right;margin-top:20px;
  }
 
  footer{
    text-align:center;padding:50px 20px;font-weight:300;color:var(--texto);
  }
  footer .linha{font-size:26px;font-family:'Pacifico',cursive;color:var(--lilas)}
 
  /* ====== MÚSICA ====== */
  #botaoMusica{
    position:fixed;bottom:24px;right:24px;z-index:999;
    width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--rosa),var(--lilas));
    color:#fff;font-size:26px;
    box-shadow:0 8px 24px rgba(255,94,156,.5);
    transition:transform .2s ease;
  }
  #botaoMusica:hover{transform:scale(1.1)}
  #botaoMusica.tocando{animation:girar 3s linear infinite}
  @keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  #avisoMusica{
    position:fixed;bottom:100px;right:24px;z-index:999;
    background:#fff;color:var(--texto);padding:12px 18px;border-radius:14px;
    font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(74,43,94,.25);
    opacity:0;pointer-events:none;transition:opacity .3s;
    max-width:260px;
  }
  #avisoMusica.visivel{opacity:1}
 
  /* Aviso grande quando o navegador bloqueia o som automático */
  #overlayMusica{
    position:fixed;inset:0;z-index:998;display:none;
    align-items:center;justify-content:center;
    pointer-events:none;
    background:rgba(74,43,94,.28);
    backdrop-filter:blur(3px);
  }
  #overlayMusica.visivel{display:flex}
  #overlayMusica .conteudo{
    background:#fff;border-radius:24px;padding:30px 38px;text-align:center;
    box-shadow:0 15px 40px rgba(74,43,94,.4);
    font-weight:600;font-size:19px;
    max-width:340px;line-height:1.6;
    animation:pulsar-suave 1.6s ease-in-out infinite;
  }
  #overlayMusica .conteudo small{
    display:block;margin-top:12px;
    font-weight:300;font-size:14px;opacity:.75;
  }
  @keyframes pulsar-suave{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
 
  /* ====== RESPONSIVO (celulares e tablets) ====== */
  @media (max-width: 900px){
    .galeria{columns:2;column-gap:12px}
    .foto-card{margin-bottom:12px}
    .cartas{gap:16px}
  }
  @media (max-width: 600px){
    section{padding:56px 14px}
    .hero{min-height:100svh;padding:30px 16px}
    .hero .coracao-grande{font-size:54px}
    .botao-entrar{padding:14px 30px;font-size:17px;width:100%;max-width:320px}
    .contador{gap:12px}
    .contador .caixa{flex:1 1 40%;min-width:0;padding:20px 10px;border-radius:18px}
    .contador .numero{font-size:32px}
    .contador .rotulo{font-size:12px}
    .galeria{column-gap:10px}
    .foto-card{margin-bottom:10px;border-radius:18px}
    .cartas{grid-template-columns:1fr}
    .carta{height:250px}
    .carta-final .papel{padding:38px 20px 30px;font-size:16px;line-height:1.8}
    .carta-final .papel .assinatura{font-size:26px}
    #botaoMusica{width:54px;height:54px;font-size:22px;bottom:16px;right:16px}
    #avisoMusica{bottom:80px;left:16px;right:16px;max-width:none;font-size:12px;text-align:center}
    footer{padding:40px 16px}
    footer .linha{font-size:22px}
  }
 
  /* ====== CORAÇÕES FLUTUANDO ====== */
  .coracao-flutuante{
    position:fixed;bottom:-60px;z-index:1;pointer-events:none;
    animation:subir linear forwards;
    font-size:24px;
  }
  @keyframes subir{
    to{transform:translateY(-110vh) rotate(360deg);opacity:0}
  }
</style>
</head>
<body class="travado">
 
<style>
  /* ====== TELA DE SENHA (cadeado romântico) ====== */
  body.travado{overflow:hidden;height:100vh}
  #telaCadeado{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,94,156,.20) 0,transparent 40%),
      radial-gradient(circle at 85% 30%,rgba(168,107,255,.22) 0,transparent 45%),
      radial-gradient(circle at 50% 85%,rgba(255,158,79,.20) 0,transparent 40%),
      linear-gradient(135deg,#fff0f6 0%,#f3e8ff 50%,#ffd6e8 100%);
  }
  .cadeado-caixa{
    background:#fff;border-radius:28px;padding:46px 36px;max-width:400px;
    box-shadow:0 18px 50px rgba(74,43,94,.28);
  }
  .cadeado-emoji{font-size:64px;animation:apertar 1.4s ease-in-out infinite;display:inline-block}
  .cadeado-titulo{
    font-family:'Pacifico',cursive;font-weight:400;
    font-size:30px;margin:14px 0 6px;
    background:linear-gradient(90deg,var(--rosa),var(--lilas));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cadeado-sub{font-weight:300;margin-bottom:26px}
  .cadeado-form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #campoSenha{
    padding:13px 18px;border:2px solid var(--rosa-claro);border-radius:999px;
    font-family:'Poppins',sans-serif;font-size:16px;text-align:center;
    outline:none;width:190px;transition:border .2s;
  }
  #campoSenha:focus{border-color:var(--rosa)}
  #botaoAbrir{
    padding:13px 26px;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,var(--rosa),var(--lilas));color:#fff;
    font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;
    box-shadow:0 8px 20px rgba(255,94,156,.4);transition:transform .2s;
  }
  #botaoAbrir:hover{transform:scale(1.06)}
  .erro-cadeado{
    display:none;margin-top:16px;font-size:14px;font-weight:600;color:#d6336c;
  }
  .erro-cadeado.visivel{display:block}
  .treme{animation:treme .4s}
  @keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
 
<!-- ===== TELA DE SENHA ===== -->
<div id="telaCadeado">
  <div class="cadeado-caixa">
    <div class="cadeado-emoji">🔒</div>
    <h1 class="cadeado-titulo">Eu tenho um segredo para você…</h1>
    <p class="cadeado-sub">Só quem tem o coração certinho consegue entrar 💖</p>
    <div class="cadeado-form">
      <input type="password" id="campoSenha" placeholder="senha especial" autocomplete="off">
      <button type="button" id="botaoAbrir" onclick="abrirCadeado()">Abrir 🔑</button>
    </div>
    <div id="erroCadeado" class="erro-cadeado">Hmm… essa não é a senha do nosso segredo 💔 Tente de novo!</div>
  </div>
</div>

function deBase64(texto){
  const bruta = atob(texto.replace(/-/g,'+').replace(/_/g,'/'));
  const bytes = new Uint8Array(bruta.length);
  for (let i = 0; i < bruta.length; i++) bytes[i] = bruta.charCodeAt(i);
  return bytes;
}

async function descriptografar(senha){
  const salt   = deBase64(CADEADO.saltBatch);
  const iv     = deBase64(CADEADO.ivBase64);
  const cifrado= deBase64(CADEADO.textoCifrado);
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']
  );
  const chave = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations: CADEADO.iteracoes, hash:'SHA-256' },
    material, { name:'AES-CBC', length:256 }, false, ['decrypt']
  );
  const plano = await crypto.subtle.decrypt({ name:'AES-CBC', iv }, chave, cifrado);
  return new TextDecoder('utf-8').decode(plano);
}

function desbloquear(html){
  const destino = document.getElementById('conteudoSite');
  destino.innerHTML = html;
  let contador = destino.querySelector('.contador');
  if (!contador) {
    const secaoContador = document.createElement('section');
    secaoContador.id = 'secaoContador';
    secaoContador.setAttribute('aria-labelledby', 'tituloContador');
    secaoContador.innerHTML = `
      <h2 id="tituloContador">Nosso tempo juntos</h2>
      <p class="intro">Cada momento ao seu lado é especial 💖</p>
      <div class="contador" aria-live="polite"></div>`;
    contador = secaoContador.querySelector('.contador');
    const hero = destino.querySelector('.hero');
    if (hero) {
      hero.insertAdjacentElement('afterend', secaoContador);
    } else {
      destino.prepend(secaoContador);
    }
  }
  destino.querySelectorAll('script').forEach(s => {
    const novo = document.createElement('script');
    Array.from(s.attributes).forEach(a => novo.setAttribute(a.name, a.value));
    novo.textContent = s.textContent;
    s.replaceWith(novo); // próprios scripts executam aqui
  });
  renderizarContadorTempo(contador);
  setInterval(() => renderizarContadorTempo(contador), 3600000);
  document.title = 'Para Gleice ❤️';
  document.body.classList.remove('travado');
  tela = document.getElementById('telaCadeado');
  if (tela) tela.remove();
  if (typeof tocarMusica === 'function') try{ tocarMusica(); }catch(e){}
}

async function abrirCadeado(){
  const campo = document.getElementById('campoSenha');
  const erro  = document.getElementById('erroCadeado');
  const caixa = document.querySelector('.cadeado-caixa');
  const senha = campo.value;
  if (!senha) { campo.focus(); return; }
  erro.classList.remove('visivel');
  try {
    const html = await descriptografar(senha);
    if (html.indexOf('<') === -1) throw new Error('conteudo');
    desbloquear(html);
  } catch (e) {
    erro.classList.add('visivel');
    caixa.classList.remove('treme'); void caixa.offsetWidth;
    caixa.classList.add('treme');
    campo.value = '';
    campo.focus();
  }
}

document.getElementById('campoSenha').addEventListener('keydown', function(e){
  if (e.key === 'Enter') abrirCadeado();
});

function renderizarContadorTempo(contadorElement) {
  // Data base fornecida: 26/06/2026 18h
  const dataBase = new Date("2026-06-26T18:00:00").getTime();
  const agora = new Date().getTime();
  const diferenca = Math.max(0, agora - dataBase);

  // Cálculo de tempo
  const msAno = 365.25 * 24 * 60 * 60 * 1000;
  const msMes = 30.44 * 24 * 60 * 60 * 1000;
  const msDia = 24 * 60 * 60 * 1000;
  const msHora = 60 * 60 * 1000;

  // Separar o tempo decorrido em anos, meses, dias e horas
  let anos = Math.floor(diferenca / msAno);
  let restante = diferenca % msAno;

  let meses = Math.floor(restante / msMes);
  restante = restante % msMes;

  let dias = Math.floor(restante / msDia);
  restante = restante % msDia;

  let horas = Math.floor(restante / msHora);

  // Mapeamento dos valores e rótulos
  const unidades = [
    { valor: anos, rotulo: 'ANOS', id: 'c-anos' },
    { valor: meses, rotulo: 'MESES', id: 'c-meses' },
    { valor: dias, rotulo: 'DIAS', id: 'c-dias' },
    { valor: horas, rotulo: 'HORAS', id: 'c-horas' }
  ];

  // Construção do HTML dinamicamente
  let htmlContador = '';
  unidades.forEach(u => {
    htmlContador += `
      <div class="caixa">
        <div class="numero" id="${u.id}">${u.valor}</div>
        <div class="rotulo">${u.rotulo}</div>
      </div>`;
  });

  contadorElement.innerHTML = htmlContador;
}
</script>
